AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  WXYC synthetic-DJ canary. Lambda function on a 5-minute schedule that
  exercises the WXYC user-facing API surface and emits CloudWatch metrics
  + alarms when anything fails.

Parameters:
  BackendUrl:
    Type: String
    Default: https://api.wxyc.org
    Description: Backend-Service base URL.
  AuthUrl:
    Type: String
    Default: https://api.wxyc.org/auth
    Description: better-auth base URL.
  SemanticIndexUrl:
    Type: String
    Default: https://explore.wxyc.org
    Description: semantic-index base URL.
  LmlUrl:
    Type: String
    Default: https://library-metadata-lookup-production.up.railway.app
    Description: >
      library-metadata-lookup base URL. The `lml-auth` check POSTs
      directly to `${LmlUrl}/api/v1/lookup` with `LML_API_KEY` to detect
      bearer rotation drift in isolation from the BS proxy path.
  LegacyPlaylistUrl:
    Type: String
    Default: http://wxyc.info
    AllowedPattern: '^https?://.+'
    Description: >
      Base URL of the legacy tubafrenzy host the mobile fleet still polls for
      the flowsheet. The `wxyc-info-recent-entries` check (wxyc-canary#93)
      appends `/playlists/recentEntries?v=2&n=50` to it — the
      only probe in this canary that traverses the WXYC/tubafrenzy#620 bridge
      (DNS -> Kattare Tomcat -> servlet -> HTTPS -> AWS -> Express) rather
      than talking to api.wxyc.org directly. Plain `http://` on purpose: that
      is the scheme both shipped clients hardcode, so probing https:// would
      measure a path no user takes.

      To pause the probe, flip `EnableLegacyBridgeProbe` below — do NOT try to
      blank this parameter. `sam deploy`'s shorthand `Key=Value` override
      rejects an empty value at the CLI layer before CloudFormation ever sees
      it (commit 581f74b hit exactly that with `GhaRunnerTokenSsmParamName=`),
      so an empty-string lever here would be a documented command that errors
      out. `AllowedPattern` therefore requires an http(s) prefix outright,
      which also fails a malformed value at deploy rather than at every tick.
  EnableLegacyBridgeProbe:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to run the `wxyc-info-recent-entries` bridge probe. Set to
      'false' to retire it ahead of the WXYC/wiki#100 DNS flip without waiting
      on a code deploy — the env var is then forced empty, the check
      downgrades to skipped, and both bridge alarms go to no-data/OK.

      This exists as a boolean rather than an empty `LegacyPlaylistUrl`
      because `sam deploy` cannot forward an empty override value (see that
      parameter's note); 'false' is an ordinary non-empty token the CLI
      accepts. Same shape as `EnableWriteProbe`, and the same
      condition-forces-the-env-var-empty mechanism as `HasGhaRunnerProbe`.

      This is the TRANSITION lever, not retirement: retirement proper is
      deleting the check, its two alarms, and both of these parameters.
  LmlApiKeySecretArn:
    Type: String
    Default: ''
    Description: >
      Optional ARN of a Secrets Manager secret whose `SecretString` is
      the production LML bearer (plain string, not JSON — matches
      Railway's one-secret-one-value convention so the bearer rotates
      in one place across BS + rom + tubafrenzy + canary). When empty,
      the `lml-auth` check downgrades to skipped (operator gap, not
      regression — same shape as the DJ-credentials path).
  DjCredentialsSecretArn:
    Type: String
    Default: ''
    Description: >
      Optional ARN of a Secrets Manager secret holding the canary DJ login.
      JSON shape: {"email": "...", "password": "..."}. When empty, DJ-auth
      checks downgrade to skipped (not failed).
  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Optional email address subscribed to the user-facing-outage page
      (`wxyc-canary-check-failure`, via `AlertTopic`). Leave empty to manage
      subscriptions outside this stack (e.g., wire to a Slack webhook via a
      separate subscription).
  InfraAlertEmail:
    Type: String
    Default: ''
    Description: >
      Optional email address subscribed to the low-urgency
      infra-degraded alarm (`wxyc-canary-infra-degraded`, via
      `InfraAlertTopic`) — the tier that catches a CI-runner offline or a
      nightly explore.wxyc.org blip without paging on-call (wxyc-canary#48
      DP2). Leave empty (the default) for console-only: the alarm still
      transitions in CloudWatch but nothing is notified. Set it to a
      filtered alias to get low-urgency email without a code change. An
      empty value is an accepted gap, not a silent one — record it.
  ScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: EventBridge schedule for the canary. rate() or cron().
  EnableWriteProbe:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Opt in to the enrichment-quality write canary. When 'true', every
      invocation inserts a sentinel flowsheet row, polls for enrichment,
      and deletes the row. Defaults 'false' so a fresh deploy does not
      write to production until the DJ test account is provisioned and
      the operator has reviewed the cleanup-on-failure behaviour.
  EnrichmentLagThresholdSeconds:
    Type: Number
    Default: 30
    Description: >
      EnrichmentLag alarm threshold, in seconds. Fires when the canary's
      sentinel row took longer than this to be populated with a
      `youtube_music_url`. 30 s is the BS-side fire-and-forget timeout
      after which a real iOS playcut would already have rendered with
      null metadata.
  GitHubTokenSsmParamName:
    Type: String
    Default: ''
    AllowedPattern: '^(|/.+)$'
    Description: >
      Optional SSM Parameter Store name (SecureString) holding a fine-scoped
      GitHub PAT with `issues:write` on the issue target repo. Must begin
      with `/` (e.g. `/wxyc-canary/github-token`) so the IAM policy ARN
      composes correctly. When set together with GitHubIssuesRepo, each
      Lambda invocation mirrors check outcomes into GitHub issues: opens
      an issue on first fail, comments on repeat fails (deduped by
      `canary:check:{name}` label), and closes with a recovery comment
      when the check passes. Leave empty to keep SNS-only alerting.
  GitHubIssuesRepo:
    Type: String
    Default: ''
    Description: >
      Optional `owner/repo` target for canary-filed issues, e.g.
      `WXYC/wxyc-canary`. Paired with GitHubTokenSsmParamName.
  GhaRunnerTokenSsmParamName:
    Type: String
    Default: ''
    AllowedPattern: '^(|/.+)$'
    Description: >
      Optional SSM Parameter Store name (SecureString) holding a
      fine-scoped GitHub PAT with `admin:org → Self-hosted runners:
      Read` (classic) or the fine-grained equivalent on the WXYC org.
      Must begin with `/` (e.g. `/wxyc-canary/gha-runner-token`) so
      the IAM policy ARN composes correctly. When set together with
      `GhaRunnerId`, the `gha-runner-online` check polls
      `GET /orgs/{org}/actions/runners/{id}` every 5 minutes and the
      low-urgency `wxyc-canary-infra-degraded` alarm fires after ~10
      minutes of sustained `status != "online"` (this check is infra-tier,
      `pagesOncall: false`, so it does not trip the user-facing page).
      Leave empty to skip the probe (operator gap, no alarm).
  GhaRunnerOrg:
    Type: String
    Default: WXYC
    Description: GitHub organization that owns the self-hosted runner.
  OidcProbeClientId:
    Type: String
    Default: wxyc-canary
    Description: >
      OIDC trusted-client id the `oidc-authorize` check (wxyc-canary#60)
      sends as `client_id` on `/oauth2/authorize`. The auth server MUST
      have a matching public trustedClient registered
      (WXYC/Backend-Service#1576) — a mismatch fails the probe with
      `authorize expected 302, got 400: invalid client_id`. Overridable so
      a future rev of the trusted client's id doesn't require a code
      change here; empty-string picks up the handler default (`||`, not
      `??`, in src/handler.ts).
  OidcProbeRedirectUri:
    Type: String
    Default: https://canary.wxyc.invalid/authorize-echo
    AllowedPattern: '^https?://.+'
    Description: >
      Redirect URI the `oidc-authorize` probe's trusted client is
      registered with. The URL never has to resolve — the check reads the
      3xx `Location` with `redirect: 'manual'` and never follows it. Uses
      the RFC 2606 `.invalid` TLD so a routing accident can never
      exfiltrate authorization codes to a real host, and so the URL is
      unambiguously non-resolving to future readers (BS#1584).
      The check asserts the returned Location matches this value on
      `origin` (strict compare — rejects prefix-crafted attacker URLs
      like `https://canary.wxyc.invalid/authorize-echo-attacker.example.com`)
      and on `pathname` after trailing-slash normalization: strips ALL
      trailing slashes on both sides so `/authorize-echo`,
      `/authorize-echo/`, and `/authorize-echo//` all compare equal (a
      single-slash drift between server registration and this param
      would otherwise flap the alarm every tick). Narrower than full
      RFC 3986 §6.2.3 — see `src/oidc-authorize.ts`'s `normalizePath`
      docstring for what's deliberately out of scope. `AllowedPattern`
      requires an `http://` or `https://` prefix as cheap boot-time
      validation so a malformed value fails at deploy rather than paging
      every tick from the runtime check. Because the pattern also
      rejects empty strings, an operator cannot rely on the handler-side
      `||` default here (wxyc-canary#68 R4-5); pass a real URL or omit
      the parameter to accept the CFN default above.
  GhaRunnerId:
    Type: Number
    Default: 0
    Description: >
      Numeric runner id assigned by GitHub at registration. Discover via
      `gh api /orgs/WXYC/actions/runners --jq '.runners[] | select(.name=="wxyc-e2e-runner") | .id'`.
      The id changes when the runner is replaced (re-registration), so
      this parameter must be re-set after an instance swap — see
      wxyc-shared `scripts/e2e-runner/README.md`. Leave at 0 to skip the
      probe (the check downgrades to skipped, no alarm). Disabling
      mechanism: the `HasGhaRunnerProbe` condition sets the env var to
      empty string when this parameter is 0, which the handler env loader
      reads as undefined; the check's own runner-id guard
      (`Number.isInteger(id) && id > 0`) is the second line of defense
      for any non-CFN deploy path (local invoke, manual env override).

  StreamSamplerState:
    Type: String
    Default: ENABLED
    AllowedValues: ['ENABLED', 'DISABLED']
    Description: >
      Whether the stream listener sampler's EventBridge schedule fires. This
      is a `State:` on the schedule rather than SAM's `Enabled:` boolean on
      purpose — `Enabled` takes a real boolean and rejects the intrinsic
      (`!Ref`) that a parameterised lever requires, so the parameterised form
      has to go through `State` with AllowedValues.

      Flip to DISABLED to pause sampling without a code deploy. Note that
      pausing leaves a gap in a continuous time series: unlike the canary's
      probes, a skipped tick here is lost data, not merely an unrun check.
  StreamSamplerSchedule:
    Type: String
    Default: rate(5 minutes)
    Description: >
      EventBridge schedule for the listener sampler. 5 minutes yields 288
      samples/day — three per quarter-hour, enough to average concurrent
      listeners into an AQH-comparable figure — and pins PostHog ingestion at
      a constant 288 events/day regardless of traffic. Raising the frequency
      is a billing decision: this is a fixed-rate timer capture, the shape
      that caused the 2026-08-04 org-wide quota cutoff when it was allowed to
      scale with load. Anything under 5 minutes should be justified against
      that history first.
  StreamSamplerStatusUrl:
    Type: String
    Default: https://audio-mp3.ibiblio.org/status-json.xsl
    AllowedPattern: '^https://.+'
    Description: >
      Icecast status endpoint carrying the WXYC mounts. HTTPS is required by
      the pattern: plain http:// on this host answers with an empty body,
      which would register as a parse failure on every single tick rather
      than failing loudly once at deploy.

      This is ibiblio's shared Icecast — it also serves several unrelated
      stations. The sampler filters to WXYC mounts by prefix and never emits
      a co-tenant's listener counts.
  StreamSamplerPostHogApiKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: >
      PostHog project ingestion token (`phc_...`) for the wxyc.org project
      (138666). Deliberately has NO default value in this public repo: a phc_
      token is write-only, but publishing one invites junk events into a
      project whose quota is shared org-wide, and event quota is exactly what
      went down on 2026-08-04. CI passes it from the
      STREAM_SAMPLER_POSTHOG_API_KEY secret.

      Empty (the default) means the sampler still runs and logs but does not
      capture — the dry-run posture for a first deploy.
  StreamSamplerPostHogHost:
    Type: String
    Default: https://us.i.posthog.com
    Description: PostHog capture-API host (US cloud).

Conditions:
  HasDjCredentials: !Not [!Equals [!Ref DjCredentialsSecretArn, '']]
  HasLmlApiKey: !Not [!Equals [!Ref LmlApiKeySecretArn, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasInfraAlertEmail: !Not [!Equals [!Ref InfraAlertEmail, '']]
  HasGitHubReporter: !And
    - !Not [!Equals [!Ref GitHubTokenSsmParamName, '']]
    - !Not [!Equals [!Ref GitHubIssuesRepo, '']]
  HasLegacyBridgeProbe: !Equals [!Ref EnableLegacyBridgeProbe, 'true']
  HasGhaRunnerProbe: !And
    - !Not [!Equals [!Ref GhaRunnerTokenSsmParamName, '']]
    # !Ref on a Number parameter returns the value as a string ("0"), so the
    # right-hand operand of !Equals must be the literal string "0", not 0.
    - !Not [!Equals [!Ref GhaRunnerId, '0']]

Resources:
  CanaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wxyc-canary
      Description: Synthetic-DJ canary; runs every 5 minutes against prod.
      CodeUri: dist/
      Handler: handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 60
      Environment:
        Variables:
          CANARY_BACKEND_URL: !Ref BackendUrl
          CANARY_AUTH_URL: !Ref AuthUrl
          CANARY_SEMANTIC_INDEX_URL: !Ref SemanticIndexUrl
          CANARY_LML_URL: !Ref LmlUrl
          # Forced to empty-string when the probe is disabled, so the handler
          # sees a falsy value and the check downgrades to skipped (no alarm) —
          # the same mechanism CANARY_GHA_RUNNER_ID uses below. The handler
          # reads this with `??` (not `||`) precisely so an empty string
          # survives as the skip signal instead of falling back to the default.
          # CloudFormation and Lambda both accept an empty env-var VALUE; it is
          # only `sam deploy`'s CLI-layer override parser that rejects an empty
          # one, which is why the operator lever is the boolean parameter
          # rather than a blank URL.
          CANARY_LEGACY_PLAYLIST_URL: !If [HasLegacyBridgeProbe, !Ref LegacyPlaylistUrl, '']
          CANARY_LML_API_KEY_SECRET_ARN: !If [HasLmlApiKey, !Ref LmlApiKeySecretArn, '']
          CANARY_DJ_SECRET_ARN: !If [HasDjCredentials, !Ref DjCredentialsSecretArn, '']
          CANARY_ENABLE_WRITE_PROBE: !Ref EnableWriteProbe
          CANARY_GITHUB_TOKEN_SSM_PARAM: !If [HasGitHubReporter, !Ref GitHubTokenSsmParamName, '']
          CANARY_GITHUB_ISSUES_REPO: !If [HasGitHubReporter, !Ref GitHubIssuesRepo, '']
          CANARY_GHA_RUNNER_TOKEN_SSM_PARAM: !If [HasGhaRunnerProbe, !Ref GhaRunnerTokenSsmParamName, '']
          CANARY_GHA_RUNNER_ORG: !Ref GhaRunnerOrg
          # Empty-string when the probe is disabled so the handler env loader
          # sees a falsy value and the check downgrades to skipped (no alarm).
          # When the probe is enabled, CFN stringifies the Number to e.g. "250".
          CANARY_GHA_RUNNER_ID: !If [HasGhaRunnerProbe, !Ref GhaRunnerId, '']
          # OIDC authorize probe (wxyc-canary#60). Threaded unconditionally so
          # the check reads its client_id + redirect_uri from a single source
          # of truth (CFN → env → context) rather than falling through to the
          # handler's `||` default. The handler default remains as a
          # belt-and-suspenders backstop for the local `.env` / test path
          # where CFN doesn't run.
          CANARY_OIDC_PROBE_CLIENT_ID: !Ref OidcProbeClientId
          CANARY_OIDC_PROBE_REDIRECT_URI: !Ref OidcProbeRedirectUri
      Policies:
        - Statement:
            - Effect: Allow
              Action: cloudwatch:PutMetricData
              Resource: '*'
              Condition:
                StringEquals:
                  cloudwatch:namespace: WXYC/Canary
        - !If
          - HasDjCredentials
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DjCredentialsSecretArn
          - !Ref AWS::NoValue
        - !If
          - HasLmlApiKey
          - Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref LmlApiKeySecretArn
          - !Ref AWS::NoValue
        - !If
          - HasGitHubReporter
          - Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GitHubTokenSsmParamName}
          - !Ref AWS::NoValue
        - !If
          - HasGhaRunnerProbe
          - Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GhaRunnerTokenSsmParamName}
          - !Ref AWS::NoValue
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref ScheduleExpression
            Description: Run the WXYC canary on a fixed cadence.

  CanaryLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${CanaryFunction}
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # Stream listener sampler (audience measurement, NOT liveness monitoring)
  #
  # Deliberately a second function rather than another canary check. The canary
  # asserts that the stack is up and pages when it is not; this records how many
  # people are connected to the WXYC stream so that number can be compared with
  # broadcast ratings. Keeping them apart means a sampling failure can never
  # page, an alarm suppression can never silence sampling, and the canary's
  # wall-clock budget is not spent on an unrelated third-party fetch.
  #
  # It publishes no CloudWatch metrics and owns no alarms — its only output is
  # a PostHog event and a log line.
  # ---------------------------------------------------------------------------
  StreamSamplerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: wxyc-stream-listener-sampler
      Description: Samples WXYC Icecast concurrent listeners every 5 minutes into PostHog.
      CodeUri: dist/
      Handler: stream-sampler-handler.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 128
      # Worst case is THREE HTTP calls, not two: the status read is retried
      # once (8s + 8s) before the failure capture (8s), so 24s of client
      # budget plus cold start and DNS. 30s left almost no margin, and
      # overrunning it produces a Lambda timeout. 45s keeps headroom while
      # still bounding the run — the sampler must not linger, since a late
      # sample is attributed to the wrong quarter-hour.
      Timeout: 45
      Environment:
        Variables:
          SAMPLER_ICECAST_STATUS_URL: !Ref StreamSamplerStatusUrl
          SAMPLER_POSTHOG_HOST: !Ref StreamSamplerPostHogHost
          SAMPLER_POSTHOG_API_KEY: !Ref StreamSamplerPostHogApiKey
          SAMPLER_ENVIRONMENT: production
      # No Policies block: this function talks only to the public internet.
      # It needs no CloudWatch PutMetricData, no Secrets Manager, no SSM — the
      # basic Lambda execution role SAM attaches (logs only) is the whole
      # permission surface.
      #
      # MaximumRetryAttempts: 0 is load-bearing, not a tuning knob. A Schedule
      # event source is an EventBridge rule, and EventBridge invokes Lambda
      # ASYNCHRONOUSLY — which retries a throwing invocation twice by default,
      # roughly 1 and 2 minutes later. `capture()` throws on any non-2xx or
      # timeout, so with the platform default a PostHog 502 (or a capture that
      # timed out after the event had already landed) would re-run the whole
      # handler and POST a second and third `stream_listener_sample` inside the
      # same quarter-hour. That is exactly the duplicate this design forbids —
      # a duplicated sample corrupts the average worse than a missing one — and
      # it would also break the fixed 288-events/day cost invariant. The
      # in-handler read retry is the only retry this function may have.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        Schedule:
          Type: Schedule
          Properties:
            Schedule: !Ref StreamSamplerSchedule
            State: !Ref StreamSamplerState
            Description: Sample WXYC Icecast listener counts on a fixed cadence.

  StreamSamplerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${StreamSamplerFunction}
      RetentionInDays: 30

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: wxyc-canary-alerts
      DisplayName: WXYC Canary Alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # Separate low-urgency channel for the infra/CI tier (wxyc-canary#48 DP2).
  # Kept distinct from AlertTopic so the page (`wxyc-canary-check-failure`)
  # stays clean while the infra signal — runner offline, nightly
  # explore.wxyc.org blip — remains a config toggle (subscribe `InfraAlertEmail`)
  # rather than a redeploy. SNS topics are free; an unsubscribed topic is
  # console-only (the alarm transitions in CloudWatch, nothing is notified).
  InfraAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: wxyc-canary-infra-alerts
      DisplayName: WXYC Canary Infra Alerts (low-urgency)

  InfraAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasInfraAlertEmail
    Properties:
      TopicArn: !Ref InfraAlertTopic
      Protocol: email
      Endpoint: !Ref InfraAlertEmail

  # User-facing-outage page. Fires when any USER-FACING check has reported a
  # failure 2 of the last 3 evaluations (~10 minutes at the 5-minute schedule),
  # which avoids alerting on a single transient blip while still catching
  # sustained outages quickly. Targets the dimensionless `UserFacingCheckFailure`
  # aggregate (wxyc-canary#48) — every check except the two infra/CI probes
  # (`gha-runner-online`, `semantic-index-freshness`, tagged `pagesOncall: false`)
  # contributes to it. Those two route to `InfraCheckFailure` /
  # `wxyc-canary-infra-degraded` below so a runner-offline or stale-graph signal
  # no longer pages on-call and trains it to ignore the page. (`semantic-index-search`
  # was demoted here for its nightly-blip window but is back on the page now that
  # semantic-index#347 ended the in-process OOM-restart — wxyc-canary#50.)
  # See CLAUDE.md "Conventions" for the tier split and for why this isn't
  # a SUM(SEARCH(...)) alarm. AlarmName kept as `wxyc-canary-check-failure` so
  # pinned dashboards / runbook references survive the metric repoint.
  CheckFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-check-failure
      AlarmDescription: One or more user-facing WXYC canary checks have been failing.
      Namespace: WXYC/Canary
      MetricName: UserFacingCheckFailure
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Low-urgency infra/CI tier alarm (wxyc-canary#48 DP2). Same 2-of-3 ×
  # 5-min Maximum shape as the page, but targets the dimensionless
  # `InfraCheckFailure` aggregate — the series the two `pagesOncall: false`
  # probes (`gha-runner-online`, `semantic-index-freshness`) contribute to.
  # Wired to `InfraAlertTopic` (NOT `AlertTopic`) so it never trips the
  # user-facing page; with `InfraAlertEmail` empty the topic is unsubscribed
  # and the alarm is console-only. The contract test in test/handler.test.ts
  # pins that this alarm targets a metric shape the handler actually emits.
  InfraDegradedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-infra-degraded
      AlarmDescription: A WXYC canary infra/CI probe (runner liveness / semantic-index) has been failing.
      Namespace: WXYC/Canary
      MetricName: InfraCheckFailure
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic
      OKActions:
        - !Ref InfraAlertTopic

  # Enrichment-quality SLO alarm. Targets the dimensionless EnrichmentLag
  # series emitted by the `enrichment-quality` write canary. Threshold and
  # treatment-of-missing-data:
  #   - Threshold is operator-tunable via `EnrichmentLagThresholdSeconds`
  #     (default 30 s — the BS-side fire-and-forget timeout after which an
  #     iOS playcut would have rendered with null metadata).
  #   - 3 evaluation periods at 5 min cadence = the alarm needs sustained
  #     breach (15 min) before firing, which clears small Discogs-side
  #     latency spikes without delaying the on-air paging window.
  #   - `notBreaching` on missing data: when `EnableWriteProbe=false` the
  #     metric is simply absent, and the alarm must sit at OK — wxyc-canary#13
  #     pinned the "no data → no firing" failure mode the other way.
  EnrichmentLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-enrichment-lag
      AlarmDescription: WXYC canary sentinel row exceeded the enrichment lag SLO.
      Namespace: WXYC/Canary
      # The metric is suffixed with the unit because CloudWatch's dashboard
      # views surface name and unit together — `EnrichmentLagSeconds` is
      # immediately self-documenting in the metric picker. The `Seconds`
      # suffix is also the unit hint `publishMetrics` reads when emitting
      # this datum. Suffix convention: `*Seconds`, `*Milliseconds`, or
      # default `Count` (see `unitForMetric` in src/handler.ts).
      MetricName: EnrichmentLagSeconds
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !Ref EnrichmentLagThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # BS#1819 isolation-contract pair (wxyc-canary#82): a dedicated alarm for
  # the SOFT half of `lml-enrichment-lookup`'s signal. The check's own
  # status stays `pass` when LML answers with `degraded: true` or
  # `timeout: true` (a deliberate shed under Discogs/upstream pressure, or
  # the internal hard cap firing) — that's the `lml-discogs-breaker-shed`
  # metric-carries-the-signal pattern (wxyc-canary#79), so a single degraded
  # tick does not page via `wxyc-canary-check-failure`. This alarm targets
  # the dimensionless `LookupDegraded` series instead, and pages only when
  # it is sustained for 3 consecutive 5-minute evaluations (~15 min) — the
  # same "clears small Discogs-side latency spikes without delaying the
  # on-air paging window" rationale as `EnrichmentLagAlarm` above, since
  # both watch the same Discogs-dependent enrichment lane. A hard failure of
  # the check (network error, non-2xx, or an unexplained zero-result miss)
  # is a separate, harder signal and still pages via the shared
  # `wxyc-canary-check-failure` alarm — this alarm exists specifically so
  # the *expected occasional degradation* case is observable and
  # distinguishable from that hard-failure case, and from a
  # `lml-protected-search` failure, so an operator can tell from the alarm
  # name alone which user experience (local search vs. enrichment) is
  # unhealthy. `notBreaching` on missing data: with no `LML_API_KEY`
  # configured the check skips and the metric is simply absent, and the
  # alarm must sit at OK.
  LmlEnrichmentDegradedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-lml-enrichment-degraded
      AlarmDescription: >
        LML's Discogs-dependent /api/v1/lookup lane has been answering with
        degraded: true or timeout: true for 3 consecutive 5-minute checks
        (~15 min). This is expected occasional behavior under real Discogs
        pressure and is distinct from a hard lml-enrichment-lookup failure
        (which pages via wxyc-canary-check-failure) and from
        lml-protected-search (local catalog search — expected to stay green
        through this). See CLAUDE.md and docs/adding-a-check.md.
      Namespace: WXYC/Canary
      MetricName: LookupDegraded
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Discogs-breaker sustained-shed alarm (wxyc-canary#79), volume-gated
  # (wxyc-canary#84). Pages only when BOTH hold for 3 consecutive 5-minute
  # ticks (~15 min): the breaker is shedding (the dimensionless
  # DiscogsBreakerShedding series the lml-discogs-breaker-shed check emits
  # reads >= 1) AND live Discogs lookups are actually flowing
  # (DIFF(DiscogsLiveRequestsTotal) > 0 — library-metadata-lookup#940's
  # monotonic counter of live-Discogs request attempts, including
  # breaker-shed ones, also emitted dimensionless by the same check). This
  # is this repo's first metric-math alarm: a `Metrics:` array combines the
  # two dimensionless series into a single 0/1 gate via `IF(... AND ..., 1,
  # 0)`, with the gate expression as the sole `ReturnData: true` entry the
  # alarm evaluates. Unlike the shared page alarm's 2-of-3, this is 3-of-3:
  # a breaker legitimately trips OPEN for a window or two during real
  # Discogs saturation, and that must NOT page; only shedding-with-traffic
  # that holds for 3 consecutive ticks (the "never recovers on its own"
  # signature) does. Routed to the same AlertTopic the check-failure page
  # uses, since the check's own status always stays `pass` (the shed signal
  # lives entirely in this alarm, not in CheckFailure/UserFacingCheckFailure)
  # — this alarm is the only page path for this signal.
  #
  # PutMetricAlarm acceptance of this expression is VERIFIED (wxyc-canary#84,
  # 2026-07-27): a throwaway probe alarm carrying this exact `Metrics:` array
  # was created, read back, and deleted against the deploy account (503977661500,
  # us-east-1), and PutMetricAlarm accepted it. The org CLAUDE.md SEARCH/metric-
  # math caveat does NOT apply here — it's about `SUM(SEARCH(...))` cross-
  # dimension aggregation, not a fixed two-metric `IF`/`DIFF` expression like
  # this one. (`sam validate`/`--lint` can't confirm this class of acceptance,
  # which is why the probe stood in for a deploy.) If this expression is ever
  # CHANGED, re-verify the same way; the documented fallback is a composite
  # alarm ANDing a simple-form DiscogsBreakerShedding alarm with a second
  # metric-math alarm on DIFF(DiscogsLiveRequestsTotal) > 0 (shape (b) in
  # wxyc-canary#84).
  #
  # VOLUME GATE MECHANICS — how this kills the idle tail (wxyc-canary#84;
  # previously an ACCEPTED, not handled, limitation — see the docstring on
  # `lmlDiscogsBreakerShed` in src/checks.ts and wxyc-canary#79). Reading
  # LML's `/health` never advances the breaker's `open -> half-open`
  # recovery — only a live `/lookup` call does. An idle-latched breaker
  # after an overnight quiet period has a FLAT DiscogsLiveRequestsTotal (no
  # lookups => the `liveDelta` DIFF is 0 => the gate is false => no page). A
  # real shed under load keeps DiscogsLiveRequestsTotal climbing (LML#940
  # counts shed attempts too, not just admitted calls) => `liveDelta` > 0 =>
  # gate true => still pages within ~15 min. DIFF (not `abs()`, not a bare
  # `RATE`) also fails safe across an LML restart: the counter resets to 0,
  # producing one negative-diff period that correctly reads as "no traffic,"
  # masking a genuine ongoing shed for at most 1 of the 3 required periods.
  #
  # On a page, verify recovery via `api.discogs.com` spans resuming in
  # Sentry (query `span.domain:*.discogs.com` — Sentry wildcard-normalizes
  # the domain, so the literal subdomain filter returns zero rows even with
  # live traffic), not via `/health` alone. See CLAUDE.md and
  # docs/adding-a-check.md.
  DiscogsBreakerShedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-lml-discogs-breaker-shed
      AlarmDescription: >
        LML's Discogs-saturation breaker has been shedding lookup traffic
        AND live Discogs lookups are still flowing for 3 consecutive
        5-minute checks (~15 min) — a flat live-request counter under
        sustained shed (the idle tail) does not page. Verify recovery via
        api.discogs.com spans resuming in Sentry (span.domain:*.discogs.com),
        not /health alone. See CLAUDE.md and docs/adding-a-check.md.
      Metrics:
        - Id: shed
          MetricStat:
            Metric:
              Namespace: WXYC/Canary
              MetricName: DiscogsBreakerShedding
              Dimensions: []
            Period: 300
            Stat: Maximum
          ReturnData: false
        - Id: liveTotal
          MetricStat:
            Metric:
              Namespace: WXYC/Canary
              MetricName: DiscogsLiveRequestsTotal
              Dimensions: []
            Period: 300
            Stat: Maximum
          ReturnData: false
        - Id: liveDelta
          Expression: DIFF(liveTotal)
          Label: DiscogsLiveRequestsDelta
          ReturnData: false
        - Id: sheddingWithTraffic
          Expression: 'IF(shed >= 1 AND liveDelta > 0, 1, 0)'
          Label: DiscogsBreakerSheddingWithTraffic
          ReturnData: true
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # ==== wxyc-canary#93: the tubafrenzy bridge path the mobile fleet polls ====
  #
  # Both alarms below RETIRE WITH WXYC/wiki#100 (the wxyc.info DNS flip),
  # alongside the `wxyc-info-recent-entries` check and the LegacyPlaylistUrl
  # parameter. Blanking that parameter parks both at no-data/OK in the
  # meantime.
  #
  # WHY TWO ALARMS AND NOT A p95 GATE. wxyc-canary#93 replaced WXYC/wiki#88's
  # proposed `p95 <= 150ms` acceptance criterion, which was wrong in three
  # ways: it measured the api.wxyc.org origin span while claiming a
  # user-experience property; it was pinned to `?n=100`, a shape no client
  # issues; and its denominator shrinks as `playlist_api_version` rolls iOS to
  # v2 and off this route entirely. A fixed p95 is also the wrong INSTRUMENT
  # for this consumer set — both clients are 30-second pollers with
  # multi-second timeouts, so the difference between 80 ms and 400 ms is
  # invisible to a listener. What hurts them is a poll that does not complete.
  # Hence: an availability signal (the check's own throw -> the shared page)
  # plus a tail-latency alarm, with every threshold derived from a client
  # constant rather than from a percentile of our own history.

  # Tail-latency alarm. Reads the `Check`-DIMENSIONED `CheckLatency` series
  # directly — a fully-specified simple-form alarm is legal and precise, so
  # this needs no dimensionless companion and none is emitted (the org rule
  # against companions for non-alarm-input metrics still holds: the
  # dimensioned series IS the input here).
  #
  # THRESHOLD, 5000 ms = half the canary's own 10 s request budget, which is
  # in turn OkHttp's default per-socket READ timeout. Source:
  # `WXYC-Android/app/src/main/java/org/wxyc/wxycapp/di/AppModule.kt` builds
  # Retrofit without calling `.client(...)`, so Retrofit constructs a default
  # OkHttpClient, whose connect/read/write timeouts are 10 s each. That is the
  # tightest PER-HOP budget in the fleet, NOT a wall-clock deadline: OkHttp's
  # `callTimeout` defaults to 0 (disabled) and `readTimeout` restarts on every
  # successful read, and iOS's 30 s `timeoutInterval` is an inactivity timer
  # too. NO client enforces a deadline, so this threshold is deliberately
  # stricter than any client's real behaviour — erring toward reporting early.
  # See the `RECENT_ENTRIES_TIMEOUT_MS` docstring in `src/checks.ts`. Half the
  # budget is the "one bad hop from failing outright" line, with room to spare:
  # measured 2026-08-05, the check's own end-to-end time (connect + ttfb +
  # 20 KB body read + JSON parse of ~50 playcuts) was 559-775 ms, and raw
  # keep-alive ttfb was 218-251 ms. So the threshold sits ~6.5x above the
  # slowest observed real run — enough that normal variance cannot reach it,
  # tight enough to fire well before the 10 s per-hop budget. Both figures were
  # taken from a laptop, not from us-east-1 Lambda; re-baseline from
  # `CheckLatency` after a week in production before tightening this.
  #
  # 2-of-3 (not 1-of-1): the pre-flip baseline in WXYC/wiki#88 observed a
  # 5.5 s single-sample max. A one-off tail excursion is precisely what the
  # issue says NOT to page on; two of three consecutive ticks above 5 s is
  # sustained degradation.
  RecentEntriesLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-recent-entries-latency
      AlarmDescription: >
        The wxyc.info -> Backend flowsheet bridge has been answering slower
        than half of Android's 10 s OkHttp deadline for 2 of 3 consecutive
        5-minute checks. Listeners are not necessarily seeing errors yet;
        Android polls are one bad hop from timing out. Retires with
        WXYC/wiki#100.
      Namespace: WXYC/Canary
      MetricName: CheckLatency
      Dimensions:
        - Name: Check
          Value: wxyc-info-recent-entries
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Upstream-unavailable alarm — the lane that keeps a Backend outage
  # distinguishable from a bridge fault (wxyc-canary#93). The check does NOT
  # fail when tubafrenzy returns its documented fail-soft (`503` +
  # `{"error":"upstream_unavailable"}`, WXYC/tubafrenzy#620); it passes and
  # carries the signal here, so a bridge fault pages via
  # `wxyc-canary-check-failure` and a Backend outage behind the bridge pages
  # via THIS alarm. Two alarm names, two runbook entries, no log-reading
  # required to tell them apart. (Same metric-carries-the-signal shape as
  # DiscogsBreakerShedAlarm above; see docs/adding-a-check.md.)
  #
  # 3-of-6 (a 30-minute sliding window), and the arithmetic is the whole reason
  # this lane exists. Two forces pull in opposite directions.
  #
  # Against a TIGHT window: the fail-soft 503 has a measured ~0.76% baseline
  # (275 of 36,392 requests, 2026-08-02 -> 05) driven by ETL-cron contention on
  # the prod EC2 box — 143 failures in `:00-:04` and 33 in `:30-:34`, i.e. 64%
  # of failures in 17% of the clock, matching the 4 concurrent container starts
  # at `:00` and 3 at `:30`. Outside those windows the residual is ~0.33%.
  # A 2-of-3 window spuriously pages every ~20 days at the full baseline rate
  # (~107 days at the residual), which is why the shared page's shape was
  # rejected for this lane.
  #
  # Against a LOOSE window: because the fail-soft lane returns `pass`, THIS
  # ALARM IS THE ONLY DETECTOR — `UserFacingCheckFailure` stays 0, so the
  # shared page never covers for it. A CONSECUTIVE-run requirement (3-of-3)
  # therefore only detects a TOTAL outage. Every tick emits a real 0 or 1
  # datapoint, so CloudWatch's missing-data look-back cannot bridge the gaps
  # either. Simulated time-to-page for an INTERMITTENT bridge fault (the normal
  # shape of a network partition, not the exceptional one):
  #
  #     fault rate   3-of-3 mean   3-of-6 mean
  #     50%          1.2 h         0.6 h
  #     30%          4.3 h         1.3 h
  #     20%          12.9 h        2.8 h
  #     10%          92.5 h        14 h
  #
  # A bridge dropping one in ten of every phone's now-playing poll would take
  # ~4 days to page at 3-of-3. 3-of-6 dominates on BOTH axes: a spurious page
  # every ~400 days at the full 0.76% baseline (~4,900 days at the residual) —
  # better than the 2-of-3 that was rejected — while cutting detection 3-6x.
  # The clustering argument survives the wider window intact: a 30-minute span
  # contains at most one `:00-:04` and one `:30-:34` burst, so the known
  # contention pattern tops out at 2 breaching ticks and can never reach 3.
  #
  # Detection of a TOTAL outage is not what this alarm is for: a Backend
  # outage proper already pages in ~10 min via `backend-healthcheck`. The
  # diagnostic case this alarm uniquely covers is THIS alarm firing while
  # `backend-healthcheck` stays green — Backend is up but unreachable FROM
  # Kattare — and that case is disproportionately the intermittent one.
  RecentEntriesUpstreamUnavailableAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-recent-entries-upstream-unavailable
      AlarmDescription: >
        tubafrenzy's recentEntries bridge has been failing soft (503
        upstream_unavailable) for 3 of the last 6 five-minute checks — it could
        not get a usable response out of Backend. Cross-check
        `wxyc-canary-check-failure` / backend-healthcheck: if Backend is green,
        the Kattare -> AWS path is the fault, not Backend. Retires with
        WXYC/wiki#100.
      Namespace: WXYC/Canary
      MetricName: RecentEntriesUpstreamUnavailable
      Dimensions: []
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 6
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Catches the case where the Lambda itself fails to run (timeout, crash
  # before reaching the metric publish, etc). Without this, a Lambda that
  # never publishes metrics would let the check-failure and infra-degraded
  # alarms sit at OK (no data → notBreaching).
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-lambda-errors
      AlarmDescription: WXYC canary Lambda has been throwing or timing out.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CanaryFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

  # Backend-Service mutation 4xx surge alarm. Targets the dimensionless
  # MutationClientError series Backend-Service publishes from the
  # responseMetrics middleware (BS#704 added the dimensioned series,
  # BS#845 / BS PR #1309 added the dimensionless companion required for
  # plain-form alarming — see wxyc-canary#13 for the same trap on the
  # canary side). Threshold 20 per 5-minute window over 2 of 2 windows
  # means sustained >4/min for 10 minutes before paging, which absorbs
  # deploy windows and one-off transient 4xx without alerting. Investigate
  # via Sentry trace explorer — Sentry issues no longer carry 4xx after
  # BS#691.
  MutationClientErrorSurgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: wxyc-canary-mutation-4xx-surge
      AlarmDescription: >
        Sustained surge of 4xx responses on Backend-Service mutation routes
        (POST/PATCH/DELETE /flowsheet/*). Investigate via Sentry trace
        explorer — Sentry issues no longer carry 4xx after BS#691.
      Namespace: WXYC/BackendService
      MetricName: MutationClientError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic
      OKActions:
        - !Ref AlertTopic

Outputs:
  FunctionArn:
    Value: !GetAtt CanaryFunction.Arn
  AlertTopicArn:
    Value: !Ref AlertTopic
    Description: User-facing-outage page topic. Subscribe additional endpoints (Slack webhook, PagerDuty, etc.) here.
  InfraAlertTopicArn:
    Value: !Ref InfraAlertTopic
    Description: Low-urgency infra/CI tier topic (wxyc-canary#48 DP2). Subscribe a filtered alias or Slack channel for non-paging signal.
